name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            libffi-dev libssl-dev \
            libncurses5-dev libncursesw5-dev \
            build-essential cmake ccache

      - name: Install buildozer
        run: pip install buildozer==1.5.0 cython==0.29.36

      - name: Pre-accept Android SDK licenses
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          # Standard Android SDK license hashes (pre-accepted)
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd' \
            > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          printf '\n33b6937684c63422b0d057ee8e7f5eda1e04fbc2' \
            > $HOME/.buildozer/android/platform/android-sdk/licenses/android-googletv-license
          printf '\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d' \
            > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-arm-dbt-license

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('android_app/buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK
        working-directory: android_app
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=$JAVA_HOME/bin:$PATH
          buildozer -v android debug 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstagramReelsExporter-APK
          path: android_app/bin/*.apk
          retention-days: 30
